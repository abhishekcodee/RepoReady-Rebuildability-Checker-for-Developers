[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoready"
version = "0.1.0"
description = "A safe, static rebuildability checker for software projects."
readme = "README.md"
requires-python = ">=3.12.7,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "RepoReady Contributors" },
]
dependencies = []

[project.scripts]
repoready = "repoready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
